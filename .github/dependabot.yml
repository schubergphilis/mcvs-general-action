---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /configs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-all:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /configs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns:
          - "*"
