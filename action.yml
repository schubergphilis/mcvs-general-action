---
name: mcvs-general-action
description: |
  The Mission Critical Vulnerability Scanner (MCVS) General action.
inputs:
  testing-type:
    description: |
      The testing type: lint-action, lint-commit, lint-git, lint-links,
      markdownlint or yamllint.
    required: true
  zizmor-action-advanced-security:
    default: "true"
    description: Upload results to Advanced Security or not.
runs:
  using: composite
  steps:
    # GitHub does not enforce required inputs of a composite action, and an
    # unknown testing-type would otherwise skip every step and pass.
    - name: validate the testing type 🔎
      env:
        TESTING_TYPE: ${{ inputs.testing-type }}
      run: |
        types="lint-action lint-commit lint-git lint-links"
        types+=" markdownlint yamllint"
        for type in ${types}; do
          if [[ "${TESTING_TYPE}" == "${type}" ]]; then
            exit 0
          fi
        done
        echo "::error::Unknown testing-type '${TESTING_TYPE}'," \
          "use one of: ${types}" >&2
        exit 1
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        (inputs.testing-type == 'lint-commit' ||
          inputs.testing-type == 'lint-git')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-action'
      name: run zizmor 🌈
      # yamllint disable-line rule:line-length
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        advanced-security: ${{ inputs.zizmor-action-advanced-security }}
        min-severity: low
    - if: |
        github.event_name == 'pull_request' &&
        (inputs.testing-type == 'lint-commit' ||
          inputs.testing-type == 'lint-git')
      name: check out the base branch 🌳
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: .mcvs-base
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.ref }}
        repository: ${{ github.event.pull_request.base.repo.full_name }}
    - if: |
        github.event_name == 'pull_request' &&
        (inputs.testing-type == 'lint-commit' ||
          inputs.testing-type == 'lint-git')
      run: |
        # origin points at the head repository, which the pull request
        # author controls, so compare against the base branch as cloned
        # from the base repository itself.
        git fetch --no-tags "${GITHUB_WORKSPACE}/.mcvs-base" \
          "+HEAD:refs/mcvs/base"
        rm -rf "${GITHUB_WORKSPACE}/.mcvs-base"
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-commit'
      run: |
        CONFIGS_PATH="${GITHUB_ACTION_PATH}/configs"

        npm ci --prefix "${CONFIGS_PATH}"

        # HEAD is the pull request head sha checked out above.
        npx --prefix "${CONFIGS_PATH}" commitlint \
          --config "$CONFIGS_PATH/commitlint.config.mjs" \
          --from refs/mcvs/base \
          --to HEAD \
          --verbose
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        commits_behind=$(git rev-list --count HEAD..refs/mcvs/base)
        if (( commits_behind > 0 )); then
          echo "❗ Branch is behind ${BASE_REF} by $commits_behind commits"
          exit 1
        fi
        echo "✅ Branch is up to date with ${BASE_REF}"
      shell: bash
    # yamllint disable rule:line-length
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        BASE="refs/mcvs/base"

        # Merging the base branch into the feature branch yields a merge
        # whose first parent is the feature branch and whose second parent
        # is on the base branch. A merge of another topic, whose second
        # parent is not on the base branch, is fine.
        while read -r sha; do
          if git merge-base --is-ancestor "${sha}^2" "${BASE}" &&
            ! git merge-base --is-ancestor "${sha}^1" "${BASE}"; then
            echo "::error::Detected a merge of ${BASE_REF} into ${HEAD_REF}" \
              "at commit ${sha}: $(git log --format=%s -n 1 "${sha}")" >&2
            exit 1
          fi
        done < <(git rev-list --merges "${BASE}..HEAD")

        echo "✅ No merges of ${BASE_REF} detected in ${HEAD_REF}"
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      run: |
        fixup_commits=$(git log --oneline --grep="^fixup!" --grep="^squash!" refs/mcvs/base..HEAD)
        if [ -n "$fixup_commits" ]; then
          echo "❗ Found fixup or squash commits that should be squashed:"
          echo "$fixup_commits"
          exit 1
        fi
        echo "✅ No fixup or squash commits found"
      shell: bash
    - if: inputs.testing-type == 'lint-links'
      name: check links 🔗
      # yamllint disable-line rule:line-length
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        # Restates the upstream default args to append --include-fragments,
        # which validates #anchor targets. Re-sync on a lychee-action bump.
        args: >-
          --verbose --no-progress --include-fragments
          './**/*.md' './**/*.html' './**/*.rst'
    - if: inputs.testing-type == 'markdownlint'
      # yamllint disable-line rule:line-length
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        config: ${{ github.action_path }}/configs/mcvs.markdownlint.yaml
        globs: |
          **/*.md
          !**/node_modules/**
    - if: inputs.testing-type == 'yamllint'
      run: |
        python3 -m pip install --require-hashes --user \
          -r "${GITHUB_ACTION_PATH}/configs/requirements.txt"
        yamllint -c "${GITHUB_ACTION_PATH}/configs/yamllint.yaml" .
      shell: bash
